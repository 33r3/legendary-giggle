# Pre-certbot: HTTP only. Run `certbot --nginx -d __DOMAIN__` after this
# file is in place and reloaded — certbot rewrites it in-place to add the
# TLS server block and an HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # HealthKit export payloads carry route/GPS data and can be sizeable.
    client_max_body_size 20m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
